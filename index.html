<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<title>Juárez Beltrán · Villa Allende</title>
<style>
:root{--az:#1F4E79;--azm:#2E75B6;--azc:#D6E4F0;--or:#D97706;--orb:#FEF3C7;--vd:#059669;--vdb:#D1FAE5;--k:#1A1A2E;--g:#6B7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#EAECF2;color:var(--k);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.home-wrap{max-width:900px;width:100%;margin:0 auto}
.home-title{text-align:center;font-size:34px;font-weight:700;color:#1a1a2e;margin-bottom:.3rem;letter-spacing:-.01em;text-transform:none}
.home-sub{text-align:center;font-size:13px;color:#9ca3af;margin-bottom:3rem;letter-spacing:.02em;font-weight:400}
.home-cards{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;max-width:620px;margin:0 auto}
.hc{background:#fff;border:2px solid transparent;border-radius:22px;padding:2.5rem 1.8rem 2.2rem;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.1rem;transition:.18s;box-shadow:0 2px 12px rgba(0,0,0,.07);text-decoration:none;color:var(--k)}
.hc:hover{box-shadow:0 8px 32px rgba(0,0,0,.13);transform:translateY(-3px);border-color:var(--azm)}
.hc-ico{width:72px;height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.hc-ico.az{background:#E8EDF5}
.hc-ico.or{background:#F5EFE6}
.hc h3{font-size:20px;font-weight:700;color:#1a1a2e;margin:0;letter-spacing:-.01em}
.hc p{font-size:13px;color:#8a8fa8;line-height:1.55;margin:0}
.footer-note{text-align:center;margin-top:3rem;font-size:11px;color:#aaa;letter-spacing:.03em}
</style>
</head>
<body>

<div class="home-wrap">
  <img src="favicon-512.png" alt="Juárez Beltrán" style="width:96px;height:96px;display:block;margin:0 auto 20px;filter:drop-shadow(0 8px 24px rgba(31,78,121,0.30))">
  <div class="home-title">Juárez Beltrán</div>
  <div class="home-sub">VILLA ALLENDE<br>Elegí un área para empezar</div>

  <div class="home-cards">
    <a href="comercial.html" class="hc">
      <div class="hc-ico az">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="none">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#c5d6e8" stroke="#6a93b8" stroke-width="1.4" stroke-linejoin="round"/>
          <polyline points="9 22 9 12 15 12 15 22" stroke="#6a93b8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h3>Comercial</h3>
      <p>Propiedades, fichas, calendario de marketing y cronograma</p>
    </a>
    <a href="contratos.html" class="hc">
      <div class="hc-ico or">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="none">
          <rect x="4" y="2" width="16" height="20" rx="2" fill="#f5e0c5" stroke="#c47d2a" stroke-width="1.4"/>
          <line x1="8" y1="7" x2="16" y2="7" stroke="#c47d2a" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="8" y1="11" x2="16" y2="11" stroke="#c47d2a" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="8" y1="15" x2="12" y2="15" stroke="#c47d2a" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="16" cy="17" r="3" fill="#c47d2a"/>
          <line x1="14.8" y1="17" x2="17.2" y2="17" stroke="#f5e0c5" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="16" y1="15.8" x2="16" y2="18.2" stroke="#f5e0c5" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <h3>Administración</h3>
      <p>Generador de contratos de alquiler, compraventa y cesión</p>
    </a>
  </div>

  <div class="footer-note">JB Roberts Otero · INMOBILIARIA</div>
</div>

</body>
</html>
