<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<title>Comercial · Juárez Beltrán</title>
<style>
  :root{
    --bg:#E8EFF6;
    --surface:#FFFFFF;
    --surface-hover:#EEF3F8;
    --line:#D3DEE8;
    --line-soft:#E3EAF1;
    --text:#1E2733;
    --text-dim:#5B6675;
    --text-faint:#8D97A6;
    --gold:#B8860B;
    --blue:#3B5FCC;
    --blue-dim:#6B8CDB;
    --blue-bg:rgba(59,95,204,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .grid-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:32px 32px;
    opacity:0.35;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 30%, black 30%, transparent 85%);
  }

  .wrap{ position:relative; z-index:1; text-align:center; max-width:640px; width:100%; }

  .logo{ width:112px; height:112px; margin:0 auto 28px; display:block; filter:drop-shadow(0 8px 24px rgba(59,95,204,0.35)); }

  h1{
    font-family:'Segoe UI',system-ui,sans-serif; font-weight:700; font-size:34px;
    letter-spacing:-0.01em; line-height:1.15;
  }
  .subtitle{
    font-family:'Segoe UI',system-ui,sans-serif; font-size:13px; letter-spacing:0.25em;
    color:var(--blue); margin-top:8px; font-weight:600;
  }
  .tagline{ color:var(--text-faint); font-size:13px; margin-top:18px; margin-bottom:48px; }

  .sections{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:560px){ .sections{ grid-template-columns:1fr; } }

  .section-card{
    background:var(--surface); border:2px solid transparent; border-radius:22px;
    padding:2.5rem 1.8rem 2.2rem; text-decoration:none; color:var(--text);
    display:flex; flex-direction:column; align-items:center; gap:1.1rem;
    transition:.18s; box-shadow:0 2px 12px rgba(0,0,0,.07);
  }
  .section-card:hover{ box-shadow:0 8px 32px rgba(0,0,0,.13); transform:translateY(-3px); border-color:#2E75B6; }
  .section-icon{
    width:72px; height:72px; border-radius:18px; display:flex; align-items:center; justify-content:center;
  }
  .section-card.comercial .section-icon{ background:#E8EDF5; }
  .section-card.admin .section-icon{ background:#F5EFE6; }
  .section-title{ font-family:'Segoe UI',system-ui,sans-serif; font-weight:700; font-size:20px; color:#1a1a2e; letter-spacing:-.01em; }
  .section-desc{ font-size:13px; color:#8a8fa8; line-height:1.55; }

  .footer-note{ margin-top:40px; font-size:11px; color:var(--text-faint); font-family:'Segoe UI',system-ui,sans-serif; letter-spacing:0.03em; }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="wrap">
  <a href="index.html" style="display:inline-block; font-size:12px; color:var(--text-faint); text-decoration:none; margin-bottom:22px;">← Inicio</a>
  <img class="logo" src="favicon-512.png" alt="Juárez Beltrán">
  <h1>Comercial</h1>
  <div class="subtitle">VILLA ALLENDE</div>
  <div class="tagline">Elegí un área</div>

  <div class="sections">
    <a href="dashboard.html" class="section-card comercial">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="none">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#c5d6e8" stroke="#6a93b8" stroke-width="1.4" stroke-linejoin="round"/>
          <polyline points="9 22 9 12 15 12 15 22" stroke="#6a93b8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="section-title">Propiedades</div>
      <div class="section-desc">Dashboard, alertas y fichas de cada propiedad.</div>
    </a>
    <a href="alertas-calendario.html" class="section-card admin">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="none">
          <rect x="4" y="2" width="16" height="20" rx="2" fill="#f5e0c5" stroke="#c47d2a" stroke-width="1.4"/>
          <line x1="8" y1="7" x2="16" y2="7" stroke="#c47d2a" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="8" y1="11" x2="16" y2="11" stroke="#c47d2a" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="8" y1="15" x2="12" y2="15" stroke="#c47d2a" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="16" cy="17" r="3" fill="#c47d2a"/>
          <line x1="14.8" y1="17" x2="17.2" y2="17" stroke="#f5e0c5" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="16" y1="15.8" x2="16" y2="18.2" stroke="#f5e0c5" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="section-title">Marketing</div>
      <div class="section-desc">Calendario de publicaciones y cronograma.</div>
    </a>
  </div>

  <div class="footer-note">JB Roberts Otero · INMOBILIARIA</div>
</div>

</body>
</html>
