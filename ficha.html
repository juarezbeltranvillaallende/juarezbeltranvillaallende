<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">

<title>Ficha de Propiedad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E8EFF6;
    --surface:#FFFFFF;
    --surface-hover:#EEF3F8;
    --line:#D3DEE8;
    --line-soft:#E3EAF1;
    --text:#1E2733;
    --text-dim:#5B6675;
    --text-faint:#8D97A6;
    --gold:#B8860B;
    --gold-dim:#8C7420;
    --green:#3E8A5C;
    --green-bg:rgba(62,138,92,0.12);
    --amber:#C08A1E;
    --amber-bg:rgba(192,138,30,0.12);
    --red:#C1503F;
    --red-bg:rgba(193,80,63,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  .grid-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:32px 32px; opacity:0.35;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 90%);
  }
  .shell{ position:relative; z-index:1; display:flex; min-height:100vh; }

  .sidebar{ width:230px; flex-shrink:0; border-right:1px solid var(--line); padding:28px 20px; display:flex; flex-direction:column; gap:34px; }
  .brand-mark{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; }
  .brand-sub{ font-size:11px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; letter-spacing:0.03em; margin-top:2px;}
  nav{ display:flex; flex-direction:column; gap:4px; }
  .nav-item{ display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:6px; font-size:13.5px; color:var(--text-dim); border:1px solid transparent; text-decoration:none; }
  .nav-item .dot{ width:5px; height:5px; border-radius:50%; background:var(--text-faint); flex-shrink:0; }
  .nav-item.active{ background:var(--surface); color:var(--text); border-color:var(--line); }
  .nav-item.active .dot{ background:var(--gold); box-shadow:0 0 0 3px rgba(201,162,39,0.15); }
  .nav-item.disabled{ opacity:0.4; }
  .nav-item .tag{ margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--text-faint); }
  .back-link{ font-size:12px; color:var(--text-faint); text-decoration:none; display:flex; align-items:center; gap:6px; margin-top:-10px; }
  .back-link:hover{ color:var(--text-dim); }

  main{ flex:1; padding:32px 40px 70px; max-width:1180px; }
  .breadcrumb{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint); margin-bottom:14px; }
  .breadcrumb b{ color:var(--text-dim); }

  .head{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:24px; flex-wrap:wrap; }
  h1{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:25px; letter-spacing:-0.01em; max-width:600px; }
  .head-meta{ display:flex; gap:14px; margin-top:8px; flex-wrap:wrap; }
  .meta-pill{ font-size:12px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; border:1px solid var(--line); border-radius:6px; padding:4px 10px; }
  .meta-pill.missing-drive{ border-color:var(--red); background:var(--red-bg); color:var(--red); }

  .status-badge{ display:flex; align-items:center; gap:8px; border-radius:8px; padding:10px 16px; border:1px solid; flex-shrink:0; }
  .status-badge.red{ border-color:var(--red); background:var(--red-bg); }
  .status-badge.amber{ border-color:var(--amber); background:var(--amber-bg); }
  .status-badge.green{ border-color:var(--green); background:var(--green-bg); }
  .status-dot{ width:9px; height:9px; border-radius:50%; }
  .status-badge.red .status-dot{ background:var(--red); }
  .status-badge.amber .status-dot{ background:var(--amber); }
  .status-badge.green .status-dot{ background:var(--green); }
  .status-text{ font-size:12.5px; }
  .status-text b{ font-family:'IBM Plex Mono',monospace; }

  .layout{ display:grid; grid-template-columns:1.5fr 1fr; gap:24px; align-items:start; }
  @media(max-width:920px){ .layout{ grid-template-columns:1fr; } }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:20px; }
  .panel h2{ font-family:'Space Grotesk',sans-serif; font-size:14.5px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; }
  .panel h2 .small{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-faint); font-weight:400; }

  /* Gallery */
  .gallery-main{ height:280px; border-radius:9px; background:linear-gradient(135deg,#E3EAF1,#D3DEE8); display:flex; align-items:center; justify-content:center; margin-bottom:10px; position:relative; overflow:hidden; }
  .gallery-thumbs{ display:grid; grid-template-columns:repeat(6,1fr); gap:7px; }
  .gthumb{ aspect-ratio:1; border-radius:6px; background:linear-gradient(135deg,#E3EAF1,#D3DEE8); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .gthumb.active{ border-color:var(--gold); }
  .gthumb svg, .gallery-main svg{ opacity:0.6; }
  .upload-zone{
    margin-top:12px; border:1px dashed var(--line); border-radius:8px; padding:14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .upload-zone-text{ font-size:12px; color:var(--text-faint); line-height:1.5; }
  .upload-zone-text b{ color:var(--text-dim); }
  .btn{ padding:8px 14px; border-radius:6px; font-size:12px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--text-dim); font-family:'Inter',sans-serif; white-space:nowrap; }
  .btn.primary{ background:var(--gold); border-color:var(--gold); color:#181A14; font-weight:600; }
  .btn:hover{ border-color:var(--text-faint); }

  /* Info grid */
  .info-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .info-item{ }
  .info-label{ font-size:10.5px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; letter-spacing:0.03em; margin-bottom:4px; }
  .info-value{ font-size:14.5px; font-weight:500; }
  .info-value.price{ font-family:'IBM Plex Mono',monospace; color:var(--gold); font-size:16px; }
  .info-value a{ color:var(--gold); text-decoration:none; }
  .info-value a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="shell">
  <aside class="sidebar">
    <div>
      <a href="index.html" style="text-decoration:none; color:inherit;">
      <div class="brand-mark">Panel de Propiedades</div>
      <div class="brand-sub">JB Roberts Otero · INMOBILIARIA</div>
      </a>
    </div>
    <nav>
      <a href="dashboard.html" class="nav-item"><span class="dot"></span> Dashboard</a>
    </nav>
  </aside>

  <main>
    <a href="dashboard.html" class="breadcrumb">← <b>Dashboard</b> / Ficha de propiedad</a>

    <div class="head">
      <div>
        <h1 id="propTitle">Cargando…</h1>
        <div class="head-meta">
          <span class="meta-pill" id="metaType"></span>
          <span class="meta-pill" id="metaRef"></span>
          <span class="meta-pill" id="metaZone"></span>
          <span class="meta-pill" id="metaDrive"></span>
        </div>
      </div>
    </div>

    <div class="layout" id="layoutGrid">
      <!-- LEFT COLUMN -->
      <div>
        <div class="panel">
          <h2>Fotos <span class="small" id="photosHeaderSmall"></span></h2>
          <div class="gallery-main">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#8894A3" stroke-width="1.2"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/><path d="M9.5 19v-5h5v5"/></svg>
          </div>
          <div class="gallery-thumbs" id="galleryThumbs"></div>
          <div class="upload-zone">
            <div class="upload-zone-text" id="uploadZoneText"></div>
            <button class="btn primary">+ Subir fotos</button>
          </div>
        </div>

        <div class="panel">
          <h2>Información</h2>
          <div class="info-grid" id="infoGrid"></div>
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div id="rightCol">
        <div class="panel">
          <h2>📋 Detalles</h2>
          <div class="info-grid" id="detailsGrid"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxdTFRAtj_17u8RLVGiEX3p6r87my9alZ40qEr88tBs_P-UnFd7_FRROCtKe28inqIhDg/exec';

const PHOTO_MIN = 11;

let properties = [];

async function cargarFicha(){
  document.getElementById('propTitle').textContent = 'Cargando…';
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=properties');
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Error al leer Tokko');

    properties = data.propiedades.map(function(p){
      return {
        id: p.id,
        addr: p.direccion || '(sin dirección cargada)',
        type: p.tipo || 'Sin tipo',
        zone: p.zona || 'Sin zona',
        photos: p.cantidadFotos || 0,
        fotoPortada: p.fotoPortada || '',
        fotos: p.fotos || [],
        price: p.precio || 0,
        currency: p.moneda || '',
        operationType: p.tipoOperacion || '',
        referencia: p.referencia || '',
        superficie: p.superficie || 0,
        ambientes: p.ambientes || 0,
        banos: p.banos || 0,
        agente: p.agente || 'Sin asignar',
        diasEnMercado: diasDesde(p.fechaCreacion),
        publicUrl: p.urlPublica || '',
        linkDrive: p.linkDrive || ''
      };
    });

    const params = new URLSearchParams(window.location.search);
    const requestedId = parseInt(params.get('id'));
    const p = properties.find(function(x){ return x.id === requestedId; }) || properties[0];

    if(!p){
      document.getElementById('propTitle').textContent = 'No se encontraron propiedades';
      return;
    }

    renderFicha(p);
  } catch(err) {
    document.getElementById('propTitle').textContent = '⚠ No se pudo conectar con Tokko';
    document.getElementById('metaType').textContent = err.message;
  }
}

function diasDesde(fechaISO){
  if(!fechaISO) return null;
  const d = new Date(fechaISO);
  const hoy = new Date();
  return Math.max(0, Math.round((hoy - d) / (1000*60*60*24)));
}

function renderFicha(p){
  // ---- Header ----
  document.title = `${p.type} — ${p.addr}`;
  document.getElementById('propTitle').textContent = `${p.type} — ${p.addr}`;
  document.getElementById('metaType').textContent = p.type.toUpperCase();
  document.getElementById('metaRef').textContent = `REF. ${p.referencia}`;
  document.getElementById('metaZone').textContent = `Zona: ${p.zone}`;

  // Indicador de Drive
  const driveIndicator = document.getElementById('metaDrive');
  if(p.linkDrive){
    driveIndicator.textContent = '✅ Tiene Drive';
    driveIndicator.style.borderColor = 'var(--green)';
    driveIndicator.style.color = 'var(--green)';
  } else {
    driveIndicator.textContent = '❌ Sin Drive';
    driveIndicator.classList.add('missing-drive');
  }

  // ---- Photos ----
  document.getElementById('photosHeaderSmall').textContent = `${p.photos} cargadas`;
  const galleryMain = document.querySelector('.gallery-main');
  if(p.fotoPortada){
    galleryMain.innerHTML = `<img src="${p.fotoPortada}" alt="" style="width:100%;height:100%;object-fit:cover;" id="mainGalleryImg">`;
  }
  const thumbs = p.fotos.slice(0, 6);
  document.getElementById('galleryThumbs').innerHTML = thumbs.length
    ? thumbs.map(function(url, i){
        return `<div class="gthumb ${i===0?'active':''}" onclick="document.getElementById('mainGalleryImg').src='${url}'; document.querySelectorAll('.gthumb').forEach(function(t){t.classList.remove('active')}); this.classList.add('active');" style="background-image:url('${url}'); background-size:cover; background-position:center;"></div>`;
      }).join('')
    : `<div class="gthumb active"></div>`;
  const faltan = PHOTO_MIN - p.photos;
  document.getElementById('uploadZoneText').innerHTML = faltan > 0
    ? `<b>Faltan ${faltan} foto${faltan!==1?'s':''}</b> para llegar al mínimo.`
    : `<b>✅ Fotos completas.</b>`;

  // ---- Info grid ----
  document.getElementById('infoGrid').innerHTML = `
    <div class="info-item"><div class="info-label">PRECIO</div><div class="info-value price">${p.currency} ${Math.round(p.price).toLocaleString('es-AR')}</div></div>
    <div class="info-item"><div class="info-label">OPERACIÓN</div><div class="info-value">${p.operationType || '—'}</div></div>
    <div class="info-item"><div class="info-label">AMBIENTES</div><div class="info-value">${p.ambientes}</div></div>
    <div class="info-item"><div class="info-label">BAÑOS</div><div class="info-value">${p.banos}</div></div>
    <div class="info-item"><div class="info-label">SUPERFICIE</div><div class="info-value">${p.superficie ? p.superficie+' m²' : '—'}</div></div>
    <div class="info-item"><div class="info-label">EN MERCADO</div><div class="info-value">${p.diasEnMercado !== null ? p.diasEnMercado+' días' : '—'}</div></div>
  `;

  // ---- Details ----
  document.getElementById('detailsGrid').innerHTML = `
    <div class="info-item"><div class="info-label">AGENTE</div><div class="info-value">${p.agente}</div></div>
    ${p.linkDrive ? `<div class="info-item"><div class="info-label">CARPETA DRIVE</div><div class="info-value"><a href="${p.linkDrive}" target="_blank">Abrir ↗</a></div></div>` : '<div class="info-item"><div class="info-label">CARPETA DRIVE</div><div class="info-value" style="color:var(--red);">No configurado</div></div>'}
    ${p.publicUrl ? `<div class="info-item"><div class="info-label">EN TOKKO</div><div class="info-value"><a href="${p.publicUrl}" target="_blank">Ver ↗</a></div></div>` : ''}
  `;
}

cargarFicha();
</script>

</body>
</html>
